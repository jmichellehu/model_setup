# Build the Jupyter Book in docs/ and publish it to GitHub Pages.
# Requires Settings > Pages > Source: "GitHub Actions".
name: deploy-docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Site is served from https://<org>.github.io/<repo>/
  BASE_URL: /${{ github.event.repository.name }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Jupyter Book
        run: pip install "jupyter-book>=2,<3"
      # Notebook outputs are committed, so the build does not execute them
      # and the model environment is not needed.
      - name: Build HTML
        working-directory: docs
        run: jupyter-book build --html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
